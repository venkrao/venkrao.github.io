<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found - Memlum Meditation</title>
  <style>
    body {
      align-items: center;
      background: #090909;
      color: #f3f0e8;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 1.25rem;
      text-align: center;
    }

    .container {
      max-width: 520px;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin-bottom: 0.9rem;
    }

    p {
      color: #d8d2c6;
      line-height: 1.6;
      margin-bottom: 1.1rem;
    }

    a {
      border: 1px solid #f3f0e8;
      border-radius: 999px;
      color: #f3f0e8;
      display: inline-block;
      min-height: 48px;
      padding: 0.75rem 1.4rem;
      text-decoration: none;
    }

    a:hover {
      background: #f3f0e8;
      color: #090909;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist.</p>
    <a href="/">Go to Home</a>
  </div>
</body>
</html>
